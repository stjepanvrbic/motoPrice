[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motoprice"
version = "0.1.0"
description = "Motorcycle listing evaluator - analyze deals based on price, mileage, condition, and more"
authors = [
    {name = "Stjepan Vrbic", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["motorcycle", "listing", "evaluator", "scraper", "price-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "playwright>=1.41.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "fake-useragent>=1.5.0",
    "lxml>=5.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "openai>=1.12.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
moto-eval = "src.cli.cliMain:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "PT"]
ignore = [
    "N802",  # Allow camelCase for functions
    "N806",  # Allow camelCase for variables
    "E501",  # Line too long (handled by black)
    "PT003", # scope='function' is implied
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402"]  # Module level import not at top
"tests/*" = ["PT003"]   # Implied fixture scope

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true
